[wandb]
use_wandb = false

[benchmark]
model_type = "atom"
benchmark_name = "st_formic"
compile = true
compile_trace = false
runs = 3
log_weights = false

[dataloader]
multitask = false
delta_T = 3000
dataset = "tg80"
num_timesteps = 8
molecule_type = "formicacid"
explicit_hydrogen = false
explicit_hydrogen_gradients = false
radius_graph_threshold = 1.6
rrwp_length = 0
time_lag_mode = "uniform"
normalize_z = false
persistent_workers = true
num_workers = 4
pin_memory = true
prefetch_factor = 2
force_regenerate = true

[training]
device = "cuda"
seed = 42
batch_size = 100
epochs = 1000
use_amp = false
amp_dtype = "bfloat16"
max_grad_norm = 1.0
label_noise_std = 0.1

[optimizer]
type = "adamw"
learning_rate = 1e-3
weight_decay = 1e-5
adam_betas = [0.9, 0.999]
adam_eps = 1e-10

[scheduler]
type = "none"

[atom_config]
num_layers = 6
num_heads = 8
lifting_dim = 256
output_heads = 1
delta_update = false
heterogenous_attention_type = "ghca"
positional_encoding = "trope"
rope_base = 1000
rope_tau = 10000
learnable_attention_denom = false
lifting_type = "quasi_equivariant"
projection_type = "equivariant"
norm = "rms"
activation = "swiglu"
value_residual_type = "learnable"

